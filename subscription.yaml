mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fake-ip-filter:
    - "*.lan"
    - localhost.ptlogin2.qq.com
proxies:
  - name: cloady-usw1
    type: vless
    server: xray-mmi6bdch-workspace-93d8ye.cloady.io
    port: 443
    uuid: __CLOADY_UUID__
    network: ws
    tls: true
    udp: true
    servername: xray-mmi6bdch-workspace-93d8ye.cloady.io
    ws-opts:
      path: __CLOADY_PATH__
      headers:
        Host: xray-mmi6bdch-workspace-93d8ye.cloady.io
  - name: pxxl-us
    type: vless
    server: ltx-sync-3f50219b.pxxlspace.cv
    port: 443
    uuid: __PXXL_UUID__
    network: ws
    tls: true
    udp: true
    servername: ltx-sync-3f50219b.pxxlspace.cv
    ws-opts:
      path: __PXXL_PATH__
      headers:
        Host: ltx-sync-3f50219b.pxxlspace.cv
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🔯 故障转移
      - cloady-usw1
      - pxxl-us
      - DIRECT
  - name: ♻️ 自动选择
    type: url-test
    proxies:
      - cloady-usw1
      - pxxl-us
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🔯 故障转移
    type: fallback
    proxies:
      - cloady-usw1
      - pxxl-us
    url: http://www.gstatic.com/generate_204
    interval: 300
  - name: 🌍 国外媒体
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🔯 故障转移
      - cloady-usw1
      - pxxl-us
      - DIRECT
  - name: 📹 油管视频
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🔯 故障转移
      - cloady-usw1
      - pxxl-us
      - DIRECT
  - name: 🎥 奈飞视频
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🔯 故障转移
      - cloady-usw1
      - pxxl-us
      - DIRECT
  - name: 📲 电报消息
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🔯 故障转移
      - cloady-usw1
      - pxxl-us
      - DIRECT
  - name: Ⓜ️ 微软服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择
      - cloady-usw1
      - pxxl-us
  - name: 🍎 苹果服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择
      - cloady-usw1
      - pxxl-us
  - name: 🔍 谷歌服务
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🔯 故障转移
      - cloady-usw1
      - pxxl-us
      - DIRECT
  - name: 🌏 国内媒体
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - cloady-usw1
      - pxxl-us
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连
      - ♻️ 自动选择
      - 🔯 故障转移
      - cloady-usw1
      - pxxl-us
      - DIRECT
